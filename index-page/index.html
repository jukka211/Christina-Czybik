  <!-- Switches every row's default visible-image count between 1, 3, and 5
       (see getVisibleIndices in sketch.js, which already generalizes to any
       count — only the exposed choice is narrowed to these three). A native
       range input rather than a custom-built control: dragging, clicking
       the track, and arrow-key stepping all come for free, and step="2"
       with min=1/max=5 makes 1, 3, and 5 the only reachable values. See
       .col-slider in style.css for the black-line thumb styling. -->
  <div class="col-slider-wrap">

      id="colSlider"
      class="col-slider"
      min="1"
      max="5"
